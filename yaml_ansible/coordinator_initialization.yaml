---
- name: Setup Raspberry Pi Coordinator
  hosts: coordinator
  become: yes
  
  vars_files:
    - coordinator_vars.yaml 
    
  vars:
    path_base: "/home/{{ ansible_user }}/measureX"
    docker_config_dir: "{{ path_base }}"

  tasks:
    - name: Ensure required dependencies are installed 
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - python3-venv 
        state: present
        update_cache: yes

    # Docker setup
    - name: Add Docker GPG key
      apt_key:
        url: [https://download.docker.com/linux/raspbian/gpg](https://download.docker.com/linux/raspbian/gpg)
        state: present
      when: ansible_distribution == 'Raspbian' or ansible_distribution == 'Debian'

    - name: Add Docker repository
      apt_repository:
        repo: "deb [arch=armhf] [https://download.docker.com/linux/raspbian](https://download.docker.com/linux/raspbian) {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: ansible_distribution == 'Raspbian'

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin 
        state: present

    - name: Ensure docker group exists and user is added
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Restart SSH to apply docker group changes
      meta: reset_connection
      
    - name: Create a virtual environment named measurex_venv
      command:
        cmd: python3 -m venv /home/{{ ansible_user }}/measurex_venv
        creates: /home/{{ ansible_user }}/measurex_venv

    - name: Install Python dependencies from requirements.txt into virtualenv
      pip:
        requirements: "{{ path_base }}/requirements.txt"
        virtualenv: "/home/{{ ansible_user }}/measurex_venv"
        state: present
  
    - name: Customize and copy coordinatorConfig.yaml
      template:
        src: templates/coordinatorConfig.yaml.j2 
        dest: "{{ docker_config_dir }}/coordinatorConfig.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Customize and copy datasource.yaml for Grafana
      template:
        src: templates/datasource.yaml.j2
        dest: "{{ docker_config_dir }}/grafana/datasource/datasource.yaml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Start Docker containers using docker-compose
      community.docker.docker_compose_v2:
        project_src: "{{ docker_config_dir }}"
        state: present
        build: yes
        wait: yes 

    # MongoDB user creation (after container start) 
    - name: Wait for MongoDB service to be fully up
      wait_for:
        port: 27017 
        host: 127.0.0.1 
        timeout: 60
        delay: 5

    - name: Create MongoDB user for {{ MONGO_DATABASE }}
      ansible.builtin.shell: |
        docker exec measure-x-mongo mongosh admin --eval \
          "db.createUser({ \
            user: '{{ MONGO_USER }}', \
            pwd: '{{ MONGO_PASSWORD }}', \
            roles: [{ role: 'readWrite', db: '{{ MONGO_DATABASE }}' }] \
          })"
      args:
        executable: /bin/bash